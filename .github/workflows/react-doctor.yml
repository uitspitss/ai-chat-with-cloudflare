name: React Doctor
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 既定の fetch-depth: 1 だと base に到達できず scope: changed が退化する
          fetch-depth: 0
      - uses: millionco/react-doctor@695e46eee203a5d1855020191aa7e9c010a1250e # v2
        continue-on-error: true
        with:
          directory: apps/web
          blocking: none
