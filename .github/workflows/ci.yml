name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v2
      - run: nci
      # @repo/web の vitest は storybook プロジェクトを browser mode
      # （@vitest/browser-playwright）で回すので、e2e ジョブとは別にここでも
      # chromium が要る。入れ忘れると `nr test` が @repo/web#test で
      # 「Executable doesn't exist」で落ちる。
      #
      # **--with-deps を付けない。** ubuntu-latest には chromium の共有ライブラリが
      # 既に入っている一方、--with-deps は apt-get update を走らせる。実際に
      # azure.archive.ubuntu.com が応答せず 13 分ハングしてジョブがキャンセルされた。
      - name: Install Playwright browser
        working-directory: apps/web
        run: na exec playwright install chromium
      - run: nr lint
      - run: nr format:check
      - run: nr typecheck
      - run: nr test
      - run: nr build
      # 型は通るのにビルドで落ちるストーリー（動的 import、静的アセット）を拾う
      - run: nr build-storybook
      - run: nr knip

  # E2E は ci ジョブに足さず独立させる。同居させると lint の失敗を待ってから
  # 動くことになり、フィードバックが遅くなる。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v2
      - run: nci
      - name: Install Playwright browser
        working-directory: e2e
        run: na exec playwright install --with-deps chromium
      # Better Auth の署名鍵。webServer が読む .dev.vars を用意する
      - name: Prepare dev vars
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" > apps/server/.dev.vars
      - run: nr test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # デプロイは ci.yml に同居させる。別ワークフローに分けると checkout / mise / nci と
  # typecheck / lint / test が丸ごと二重に走る（turbo のリモートキャッシュも無いので
  # 本当に再計算になる）。needs で緑を待てば、その重複はそのまま消える。
  deploy:
    needs: [ci, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 連続 merge でマイグレーションの途中がキャンセルされないよう、
    # 実行中のデプロイは止めずに待たせる
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # wrangler.jsonc の vars は deploy のたびに本番へ**上書き**される。
      # README のセットアップ（database_id と本番オリジン）を踏まずに main へ
      # merge すると、本番の BETTER_AUTH_URL / TRUSTED_ORIGINS が localhost に
      # 巻き戻り、サインインが Origin 検証で全部 403 になる。ここで止める。
      - name: 本番設定が未了ならデプロイしない
        working-directory: apps/server
        run: |
          if grep -q "YOUR_DATABASE_ID" wrangler.jsonc; then
            echo "::error file=apps/server/wrangler.jsonc::database_id が未設定。README「デプロイ」の 1 を先に済ませる"
            exit 1
          fi
          if grep -q "localhost" wrangler.jsonc; then
            echo "::error file=apps/server/wrangler.jsonc::vars が localhost のまま。README「デプロイ」の 4 を先に済ませる"
            exit 1
          fi

      - uses: jdx/mise-action@v2
      - run: nci

      # 新しいコードが古いスキーマに当たらないよう、デプロイ前に流す
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/server
          command: d1 migrations apply DB --remote

      # apps/server の build は turbo.json で @repo/web#build に依存させてある
      # （wrangler.jsonc の assets.directory が ../web/dist を指すため）
      - run: na exec turbo run build --filter=@repo/server

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/server
